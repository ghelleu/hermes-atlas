<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    La scène est composée une fois pour toutes en 1920 × 1080,
    puis mise à l'échelle de la fenêtre : même composition sur tout écran.
  -->
  <div id="scene" class="scene">

    <!-- Carte : un seul SVG, construit par app.js à partir de data.js -->
    <svg id="carte" class="carte" role="group" aria-label="Carte de l'architecture"></svg>

    <!-- En-tête -->
    <header class="entete">
      <p class="surtitre"><span class="puce-ronde"></span><span id="surtitre"></span></p>
      <h1 id="titre"></h1>
      <p class="sous-ligne" id="sous-ligne"></p>
    </header>

    <!-- Recherche -->
    <div class="recherche">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="recherche" type="search" placeholder="Trouver un composant" aria-label="Trouver un composant" autocomplete="off">
      <kbd>/</kbd>
    </div>

    <!-- Panneau de gauche : couches et flux -->
    <aside class="panneau panneau-gauche" aria-label="Couches et flux">
      <div class="panneau-tete">
        <h2 id="panneau-titre">Couches</h2>
        <span class="compteur" id="panneau-compteur"></span>
      </div>
      <div class="segments" role="tablist">
        <button type="button" role="tab" class="segment" data-onglet="couches" aria-selected="true">Couches</button>
        <button type="button" role="tab" class="segment" data-onglet="flux" aria-selected="false">Flux</button>
      </div>
      <ul class="liste" id="liste-couches"></ul>
      <ul class="liste" id="liste-flux" hidden></ul>
      <div class="panneau-pied">
        <span id="pied-compte"></span>
        <button type="button" class="lien-texte" id="tout-afficher">Tout afficher</button>
      </div>
    </aside>

    <!-- Barre d'outils verticale -->
    <nav class="outils" aria-label="Outils">
      <button type="button" id="btn-lecture" title="Parcours (espace)" aria-label="Lancer le parcours">
        <svg viewBox="0 0 20 20" class="ic-lecture"><path d="M7 4.5v11l9-5.5z"/></svg>
        <svg viewBox="0 0 20 20" class="ic-pause"><path d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/></svg>
      </button>
      <span class="outils-sep"></span>
      <button type="button" id="btn-panneau" title="Couches et flux" aria-label="Afficher le panneau des couches et des flux" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M10 3.5l7 3.5-7 3.5-7-3.5z"/><path d="M3 10.5l7 3.5 7-3.5M3 14l7 3.5 7-3.5"/></svg></button>
      <button type="button" id="btn-zoom-plus" title="Zoomer (+)" aria-label="Zoomer"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button>
      <button type="button" id="btn-zoom-moins" title="Dézoomer (−)" aria-label="Dézoomer"><svg viewBox="0 0 20 20"><path d="M4 10h12"/></svg></button>
      <button type="button" id="btn-zoom-zero" title="Recentrer (0)" aria-label="Recentrer"><svg viewBox="0 0 20 20"><path d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4"/></svg></button>
      <span class="outils-sep"></span>
      <button type="button" id="btn-etiquettes" title="Étiquettes des flux" aria-label="Afficher toutes les étiquettes" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M3.5 10.5l6.8 6.8 7-7V3.5h-6.8z"/><circle cx="13.6" cy="6.4" r="1.2"/></svg></button>
      <button type="button" id="btn-export" title="Exporter en PNG" aria-label="Exporter en PNG"><svg viewBox="0 0 20 20"><path d="M10 3.5v9M6.2 9l3.8 3.8L13.8 9M4 16.5h12"/></svg></button>
    </nav>

    <!-- Carte de droite : fiche d'un composant ou étape du parcours -->
    <aside id="carte-droite" class="panneau panneau-droit" hidden tabindex="-1" aria-live="polite"></aside>

    <!-- Curseur d'éclatement -->
    <div class="eclate panneau">
      <div class="eclate-tete">
        <span>Éclater l'architecture</span>
        <span class="eclate-valeur" id="eclate-valeur">100 %</span>
      </div>
      <input type="range" id="eclate" min="0" max="100" value="100" aria-label="Éclater l'architecture">
      <div class="eclate-bornes"><span>Un seul programme</span><span>Neuf couches</span></div>
    </div>

    <!-- Pied de scène -->
    <footer class="pied">
      <span><kbd>Espace</kbd> parcours</span>
      <span><kbd>←</kbd><kbd>→</kbd> étapes</span>
      <span><kbd>0</kbd> recentrer</span>
      <span><kbd>Échap</kbd> fermer</span>
    </footer>
    <p class="source" id="source"></p>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
